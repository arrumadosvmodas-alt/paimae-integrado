name: Backend Tests (Railway path)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: paimae
          POSTGRES_PASSWORD: paimae
          POSTGRES_DB: paimae_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -e ".[dev]"
        pip install pytest-cov

    - name: Run tests
      env:
        DATABASE_URL: postgresql+psycopg://paimae:paimae@localhost:5432/paimae_test
        JWT_SECRET_KEY: test-secret
      run: |
        cd backend
        pytest --cov=app --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage.xml

  # O deploy real acontece pela integracao nativa do Railway com o GitHub
  # (deploy automatico a cada push em main), entao nao precisamos de um
  # job separado aqui - esse job usava ConductorOne/railway-action@v1, uma
  # action que nao existe/nunca resolveu, e nunca funcionou.
