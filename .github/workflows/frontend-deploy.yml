name: Frontend Build Check

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: cd frontend && npm ci

    - name: Type check
      run: cd frontend && npm run type-check
      continue-on-error: true

    - name: Build
      run: cd frontend && npm run build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist

  # O deploy real acontece pela integracao nativa do Vercel com o GitHub
  # (deploy automatico a cada push em main), entao nao precisamos de um
  # job separado aqui - esse job usava vercel/vercel-action@master, uma
  # action que nao existe/nunca resolveu, e nunca funcionou.
